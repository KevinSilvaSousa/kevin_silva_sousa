<head>

        <input type="checkbox" name="checkbox" id="checkbox">

        <br>
        <br>
        <br>
        <label for="text">Digite sua mensagem:</label>

        <textarea name="text" id="text"></textarea>
        <br>
        <input type="submit" value="enviar">
    </form>

</html>
